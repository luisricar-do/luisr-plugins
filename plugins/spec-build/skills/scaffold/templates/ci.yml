# CI = gates G2 and the automatable part of G3, on every PR and push to main.
# Pin every action by SHA (`gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`), tag in a comment.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/test
    steps:
      - uses: actions/checkout@v4 # pin by SHA
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4 # pin by SHA
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Tokens are in sync with spec/design/tokens.json
        run: pnpm tokens && git diff --exit-code apps/web/src/styles/tokens.css
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin by SHA
        with: { fetch-depth: 0 }
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 detect -s /repo --redact --no-banner

  invariants:
    # One grep per critical invariant. A failure here means the architecture drifted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # pin by SHA
      # Each check fails loudly if its folder disappears, so a rename cannot silently disable it.
      - name: process.env only in config
        run: |
          test -d apps/api/src/config && test -d apps/web/src/server
          if grep -rn "process\.env" apps/api/src --include='*.ts' | grep -v "^apps/api/src/config/"; then
            echo "api: process.env read outside apps/api/src/config"; exit 1; fi
          if grep -rn "process\.env" apps/web/src --include='*.ts' --include='*.tsx' | grep -v "^apps/web/src/server/config.ts"; then
            echo "web: process.env read outside apps/web/src/server/config.ts"; exit 1; fi
      - name: No NEXT_PUBLIC_ in web
        run: |
          if grep -rn "NEXT_PUBLIC_" apps/web/src; then echo "NEXT_PUBLIC_ is not allowed (BFF)"; exit 1; fi
      - name: server-only in web/src/server
        run: |
          missing=$(grep -rL "import 'server-only'" apps/web/src/server --include='*.ts' || true)
          if [ -n "$missing" ]; then echo "missing server-only:"; echo "$missing"; exit 1; fi
      - name: Routes do not import repositories
        run: |
          shopt -s nullglob
          routes=(apps/api/src/modules/*/routes.ts)
          [ ${#routes[@]} -eq 0 ] && { echo "no modules yet"; exit 0; }
          if grep -n "repository" "${routes[@]}"; then echo "routes must call services, not repositories"; exit 1; fi
