version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      security: { applies-to: security-updates, patterns: ['*'] }
      minor-patch: { update-types: [minor, patch] }
      major: { update-types: [major] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
